<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="John Chambard — Software engineer building production software, AI systems, and embedded hardware">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.45"/>
    </pattern>
    <radialGradient id="fade" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="300" rx="16" fill="url(#fade)"/>

  <!-- Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#0d9488" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">PURDUE CS · CLASS OF 2028</text>
    <text x="70" y="168" fill="#0f172a" font-size="62" font-weight="700" letter-spacing="-1">John Chambard</text>
    <rect x="72" y="190" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="236" fill="#475569" font-size="24">Production software · AI systems · Embedded hardware</text>
  </g>

  <!-- Mic-array motif: four sensors on a ring with propagating wavefronts -->
  <g transform="translate(1010 150)">
    <g fill="none" stroke="url(#accent)" stroke-width="2">
      <circle r="20" opacity="0">
        <animate attributeName="r" values="20;130" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="20" opacity="0">
        <animate attributeName="r" values="20;130" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="20" opacity="0">
        <animate attributeName="r" values="20;130" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle r="64" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 6"/>
    <g fill="#f8fafc" stroke="#0d9488" stroke-width="2.5">
      <circle cx="0" cy="-64" r="7"/>
      <circle cx="64" cy="0" r="7"/>
      <circle cx="0" cy="64" r="7"/>
      <circle cx="-64" cy="0" r="7"/>
    </g>
    <!-- steering beam -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
      <path d="M0 0 L104 -16 A105 105 0 0 1 104 16 Z" fill="#2563eb" opacity="0.18"/>
      <line x1="0" y1="0" x2="104" y2="0" stroke="#2563eb" stroke-width="2" opacity="0.7"/>
    </g>
    <circle r="9" fill="#0d9488"/>
  </g>
</svg>
